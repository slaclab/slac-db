# Per-device PV overrides for stations that deviate from the normal pattern.
# Keys are device MAD names; values are flat dicts of accessor_name: full_pv_address.
# An empty string means the PV is absent and the accessor is omitted from the DB.
_overrides:
    # --- TCAV0 ---
    TCAV0:
        amplitude_act_beamcode1: TCAV:IN20:490:TC0_AACT_DS0
        amplitude_des_beamcode1: TCAV:IN20:490:TC0_ADES_DS0
        phase_des_beamcode1: TCAV:IN20:490:TC0_PDES_DS0
        phase_act_beamcode1: TCAV:IN20:490:TC0_PACT_DS0
        amplitude_act_beamcode2: TCAV:IN20:490:TC0_AACT_DS3
        amplitude_des_beamcode2: TCAV:IN20:490:TC0_ADES_DS3
        phase_des_beamcode2: TCAV:IN20:490:TC0_PDES_DS3
        phase_act_beamcode2: TCAV:IN20:490:TC0_PACT_DS3
        rf_enable_beamcode1: KLYS:LI20:51:BEAMCODE1_TCTL
        rf_enable_beamcode2: KLYS:LI20:51:BEAMCODE2_TCTL
        amplitude_fbenb: TCAV:IN20:490:TC0_AMPL_FB
        amplitude_fbst: TCAV:IN20:490:TC0_AMPL_FB
        amplitude_wocho: TCAV:IN20:490:TC0_ADES
        phase_fbenb: TCAV:IN20:490:TC0_PHAS_FB
        phase_fbst: TCAV:IN20:490:TC0_PHAS_FB


    # --- GUN klystron ---
    K20_6:
        amplitude: GUN:IN20:1:GN1_AAVG
        amplitude_des: GUN:IN20:1:GN1_ADES
        phase_actual: GUN:IN20:1:GN1_PAVG
        phase_desired: GUN:IN20:1:GN1_PDES

    # --- L0A injector linac ---
    K20_7:
        amplitude_beamcode1: ACCL:IN20:300:L0A_AACT_DS0
        amplitude_des_beamcode1: ACCL:IN20:300:L0A_ADES_DS0
        phase_actual_beamcode1: ACCL:IN20:300:L0A_PACT_DS0
        phase_desired_beamcode1: ACCL:IN20:300:L0A_PDES_DS0
        amplitude_beamcode2: ACCL:IN20:300:L0A_AACT_DS1
        amplitude_des_beamcode2: ACCL:IN20:300:L0A_ADES_DS1
        phase_actual_beamcode2: ACCL:IN20:300:L0A_PACT_DS1
        phase_desired_beamcode2: ACCL:IN20:300:L0A_PDES_DS1

    # --- L0B injector linac ---
    K20_8:
        amplitude_beamcode1: ACCL:IN20:400:L0B_AACT_DS0
        amplitude_des_beamcode1: ACCL:IN20:400:L0B_ADES_DS0
        phase_actual_beamcode1: ACCL:IN20:400:L0B_PACT_DS0
        phase_desired_beamcode1: ACCL:IN20:400:L0B_PDES_DS0
        amplitude_beamcode2: ACCL:IN20:400:L0B_AACT_DS1
        amplitude_des_beamcode2: ACCL:IN20:400:L0B_ADES_DS1
        phase_actual_beamcode2: ACCL:IN20:400:L0B_PACT_DS1
        phase_desired_beamcode2: ACCL:IN20:400:L0B_PDES_DS1

    # --- L1S sub-booster ---
    K21_1:
        amplitude_beamcode1: ACCL:LI21:1:L1S_AACT_DS0
        amplitude_des_beamcode1: ACCL:LI21:1:L1S_ADES_DS0
        phase_actual_beamcode1: ACCL:LI21:1:L1S_PACT_DS0
        phase_desired_beamcode1: ACCL:LI21:1:L1S_PDES_DS0
        amplitude_beamcode2: ACCL:LI21:1:L1S_AACT_DS1
        amplitude_des_beamcode2: ACCL:LI21:1:L1S_ADES_DS1
        phase_actual_beamcode2: ACCL:LI21:1:L1S_PACT_DS1
        phase_desired_beamcode2: ACCL:LI21:1:L1S_PDES_DS1

    # --- L1X 3rd-harmonic linearizer ---
    K21_2:
        amplitude_beamcode1: ACCL:LI21:180:L1X_AACT_DS0
        amplitude_des_beamcode1: ACCL:LI21:180:L1X_ADES_DS0
        phase_actual_beamcode1: ACCL:LI21:180:L1X_PACT_DS0
        phase_desired_beamcode1: ACCL:LI21:180:L1X_PDES_DS0
        amplitude_beamcode2: ACCL:LI21:180:L1X_AACT_DS1
        amplitude_des_beamcode2: ACCL:LI21:180:L1X_ADES_DS1
        phase_actual_beamcode2: ACCL:LI21:180:L1X_PACT_DS1
        phase_desired_beamcode2: ACCL:LI21:180:L1X_PDES_DS1

    # --- L2 feedback klystrons (normal ENLD/fault PVs, special phase PV) ---
    K24_1:
        phase_actual_beamcode1: ACCL:LI24:100:KLY_PDES:SETDATA_1
        phase_desired_beamcode1: ACCL:LI24:100:KLY_PDES:SETDATA_1
        phase_actual_beamcode2: ACCL:LI24:100:KLY_PDES:SETDATA_2
        phase_desired_beamcode2: ACCL:LI24:100:KLY_PDES:SETDATA_2

    K24_2:
        phase_actual_beamcode1: ACCL:LI24:200:KLY_PDES:SETDATA_1
        phase_desired_beamcode1: ACCL:LI24:200:KLY_PDES:SETDATA_1
        phase_actual_beamcode2: ACCL:LI24:200:KLY_PDES:SETDATA_2
        phase_desired_beamcode2: ACCL:LI24:200:KLY_PDES:SETDATA_2

    K24_3:
        phase_actual_beamcode1: ACCL:LI24:300:KLY_PDES:SETDATA_1
        phase_desired_beamcode1: ACCL:LI24:300:KLY_PDES:SETDATA_1
        phase_actual_beamcode2: ACCL:LI24:300:KLY_PDES:SETDATA_2
        phase_desired_beamcode2: ACCL:LI24:300:KLY_PDES:SETDATA_2

    # --- Test Stand Station ---
    K26_3:
        is_ignored: KLYS:LI26:31:IGNORE.RVAL
        accelerate: KLYS:LI26:31:TMODE_DES.RVAL
